# FieldTally GitHub Pages site (spec §7.3, §9).
#
# Bilingual: French pages at the root for the agents the app is written for,
# English under /en/ for everyone else. Each page links to its counterpart.
title: FieldTally
description: >-
  Ingress stats tracking, mobile-first and fully local.
  An unofficial tool, not affiliated with Niantic.
lang: fr
theme: jekyll-theme-minimal

# Directory-style URLs, so the two language trees read as /installer/ and
# /en/install/ rather than carrying .html around.
permalink: pretty

# The spec (§3.1.4) requires a stable URL for the counter registry:
#   https://nohzoh.github.io/FieldTally/registry/counters.json
# The file carries no front matter, so Jekyll copies it verbatim.
include:
  - registry

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - release.md
