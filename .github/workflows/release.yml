# Signed release build (spec §7.2).
#
# Deliberately never triggered by `pull_request` or `pull_request_target`: this
# workflow holds the signing key, and a public repository must not let a branch
# proposed by anyone else reach it.
name: Release

# Two ways in, and the dispatch is now the normal one: the tag is created here,
# once the App Bundle has been built and proved to carry the real signing key.
# A tag pushed by hand still works, for a release cut from a laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.1.0). Must match app/pubspec.yaml.'
        required: true
      dry_run:
        description: 'Build and check the signing, then stop at an artifact — no tag.'
        type: boolean
        default: false

# Writes one thing: the tag. FieldTally is distributed through the Play Store,
# so this workflow publishes nothing to GitHub (#198).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.47.5

jobs:
  release:
    name: Build and sign the App Bundle, then tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, so a re-run cannot quietly recreate one that already exists.
          fetch-depth: 0

      # The version is settled once, here, and checked against the file the
      # bundle is actually built from. A tag that disagrees with pubspec.yaml
      # would name "v1.1.0" over a build whose About screen says 1.0.0 — and
      # whose versionCode may not have increased, which Play refuses outright
      # and Android refuses to install over the previous one.
      - name: Work out what is being released
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${{ inputs.version }}"
          fi
          version="${tag#v}"

          pubspec=$(sed -n 's/^version: *\([^+ ]*\)+.*/\1/p' app/pubspec.yaml)
          if [ "$version" != "$pubspec" ]; then
            echo "::error::$tag does not match app/pubspec.yaml ($pubspec) — merge the version bump first."
            exit 1
          fi

          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails here rather than producing a debug-signed bundle further down. A
      # build signed with the debug key installs perfectly well and is the
      # worst possible artifact to ship: no later update could ever replace it,
      # and Play would refuse it against the app signing key.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          [ -n "$STORE_PASSWORD" ] || missing="$missing STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/release.md"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Same gate as CI (§7.4): a release must not ship a bundled registry that
      # disagrees with the published one.
      - name: Check the registry seed is in sync
        working-directory: app
        run: dart run tool/sync_registry_seed.dart --check

      # Written outside the checkout so a stray `git add -A` in a later step
      # could not pick it up. Both files are gitignored anyway; this is the
      # second lock on the same door.
      - name: Restore the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/fieldtally-release.jks"
          echo "$KEYSTORE" | base64 --decode > "$keystore"
          cat > app/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # An App Bundle and nothing else: the Play Store is how FieldTally is
      # distributed (#198), and it takes an .aab. Play repackages it per device
      # and signs what it delivers with the app signing key, which is this same
      # keystore, imported rather than generated — so what a phone installs
      # carries the certificate this job verifies below.
      #
      # The commit is compiled in so the About screen can name the exact source
      # of a build someone is reporting a bug about. A build made from a
      # working copy has none and says so instead.
      - name: Build the signed App Bundle
        working-directory: app
        run: flutter build appbundle --release --dart-define=GIT_COMMIT=${GITHUB_SHA::7}

      # keytool, not apksigner: a bundle carries a v1 JAR signature and nothing
      # else, which is the one thing keytool can read.
      #
      # `Owner:` is checked for rather than trusting the exit status, so an
      # unsigned bundle fails here and not three steps later.
      - name: Verify the bundle is not debug-signed
        run: |
          aab=app/build/app/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$aab" > bundle-certificate.txt
          cat bundle-certificate.txt
          if ! grep -q '^Owner:' bundle-certificate.txt; then
            echo "::error::The App Bundle carries no signature at all."
            exit 1
          fi
          if grep -q "CN=Android Debug" bundle-certificate.txt; then
            echo "::error::The App Bundle is signed with the Android debug key."
            exit 1
          fi
          {
            echo '### App Bundle signing certificate'
            echo '```'
            grep -i 'SHA256' bundle-certificate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/fieldtally-release.jks"

      # Named for the person who will upload it: `app-release.aab` says nothing
      # about which version it holds, and a Downloads folder is already a pile.
      - name: Name the bundle after the release
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mv app/build/app/outputs/bundle/release/app-release.aab \
             "fieldtally-$VERSION.aab"

      # Uploaded on every run, dry or not. The bundle has exactly one reader,
      # whoever uploads it to the Play Console, and an artifact is where they
      # fetch it. A dry run is therefore enough to produce a bundle for Play,
      # with no tag created — which is also what makes it a safe rehearsal.
      - name: Upload the App Bundle
        uses: actions/upload-artifact@v7
        with:
          name: fieldtally-release-aab
          path: fieldtally-*.aab
          if-no-files-found: error

      # Only now, once the bundle exists and carries the real key. Tagging
      # first would leave a tag on a release that never shipped, and a tag
      # naming a version is a promise that it did.
      #
      # The tag is annotated but not signed: the workflow holds the Android
      # signing key, deliberately, and nothing else. What proves a build
      # genuine is its certificate, published in the job summary and on the
      # install page — not the tag.
      - name: Tag the release
        if: github.ref_type != 'tag' && !inputs.dry_run
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "FieldTally $VERSION"
          git push origin "$TAG"

