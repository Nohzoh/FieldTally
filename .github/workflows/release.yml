# Signed release build (spec §7.2).
#
# Deliberately never triggered by `pull_request` or `pull_request_target`: this
# workflow holds the signing key, and a public repository must not let a branch
# proposed by anyone else reach it.
name: Release

# Two ways in, and the dispatch is now the normal one: the tag is created here,
# once the APK has been built and proved to carry the real signing key. A tag
# pushed by hand still works, for a release cut from a laptop.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.1.0). Must match app/pubspec.yaml.'
        required: true
      dry_run:
        description: 'Build and check the signing, then stop at an artifact — no tag, no release.'
        type: boolean
        default: false

# Writes twice now: the tag, and the release.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.9

jobs:
  release:
    name: Build and publish a signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The generated changelog needs the history back to the previous tag.
          fetch-depth: 0

      # The version is settled once, here, and checked against the file the APK
      # is actually built from. A tag that disagrees with pubspec.yaml would
      # publish "v1.1.0" holding an APK whose About screen says 1.0.0 — and
      # whose versionCode may not have increased, which Android refuses to
      # install over the previous one.
      - name: Work out what is being released
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v${{ inputs.version }}"
          fi
          version="${tag#v}"

          pubspec=$(sed -n 's/^version: *\([^+ ]*\)+.*/\1/p' app/pubspec.yaml)
          if [ "$version" != "$pubspec" ]; then
            echo "::error::$tag does not match app/pubspec.yaml ($pubspec) — merge the version bump first."
            exit 1
          fi

          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails here rather than producing a debug-signed APK further down. An
      # APK signed with the debug key installs perfectly well and is the worst
      # possible artifact to publish: no later update could ever replace it.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          missing=
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ALIAS" ] || missing="$missing KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing KEY_PASSWORD"
          [ -n "$STORE_PASSWORD" ] || missing="$missing STORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/release.md"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      # Same gate as CI (§7.4): a release must not ship a bundled registry that
      # disagrees with the published one.
      - name: Check the registry seed is in sync
        working-directory: app
        run: dart run tool/sync_registry_seed.dart --check

      # Written outside the checkout so a stray `git add -A` in a later step
      # could not pick it up. Both files are gitignored anyway; this is the
      # second lock on the same door.
      - name: Restore the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/fieldtally-release.jks"
          echo "$KEYSTORE" | base64 --decode > "$keystore"
          cat > app/android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One APK holding every ABI rather than three per-ABI ones: this app is
      # sideloaded, so the file is chosen by a person reading a release page,
      # and a person cannot pick the wrong one if there is only one. The cost
      # is download size, which is the right thing to trade here.
      # The commit is compiled in so the About screen can name the exact source
      # of a build someone is reporting a bug about. A build made from a
      # working copy has none and says so instead.
      - name: Build the signed APK
        working-directory: app
        run: flutter build apk --release --dart-define=GIT_COMMIT=${GITHUB_SHA::7}

      # Proves the artifact carries the real key. Without this the whole
      # workflow could succeed and still publish something debug-signed, since
      # Gradle falls back silently when the keystore is missing.
      #
      # apksigner rather than `keytool -printcert -jarfile`: minSdk is 26, so
      # AGP signs with v2/v3 only, and keytool reads nothing but the v1 JAR
      # signature — it calls a correctly signed APK unsigned.
      - name: Verify it is not debug-signed
        run: |
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certificate.txt
          if grep -q "CN=Android Debug" certificate.txt; then
            echo "::error::The APK is signed with the Android debug key."
            exit 1
          fi
          # Published in the job log so anyone can check that an APK they
          # downloaded carries the same certificate as the one built here.
          {
            echo '### Signing certificate'
            echo '```'
            grep -i 'SHA-256 digest' certificate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing material
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/fieldtally-release.jks"

      # A dry run is for checking that signing works, so it stops here, at an
      # artifact, having created no tag and published nothing.
      - name: Upload the APK
        if: github.ref_type != 'tag' && inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: fieldtally-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Only now, once the APK exists and carries the real key. Tagging first
      # would leave a tag on a release that never shipped, and a tag naming a
      # version is a promise that it did.
      #
      # The tag is annotated but not signed: the workflow holds the Android
      # signing key, deliberately, and nothing else. What proves a release
      # genuine is the APK's certificate, published in the job summary and on
      # the install page — not the tag.
      - name: Tag the release
        if: github.ref_type != 'tag' && !inputs.dry_run
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "FieldTally $VERSION"
          git push origin "$TAG"

      # Named for the person downloading it, not for the build system that
      # produced it. `gh release create` takes the asset name from the file, and
      # Flutter's default `app-release.apk` collides with itself: a second
      # version lands as `app-release(1).apk`, in a Downloads folder that is
      # already a pile, with nothing to tell the two apart.
      - name: Publish the release
        if: github.ref_type == 'tag' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          apk="fieldtally-$VERSION.apk"
          mv app/build/app/outputs/flutter-apk/app-release.apk "$apk"

          gh release create "$TAG" "$apk" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
