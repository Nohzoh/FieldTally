# Build & tests (spec §7.1) — volontairement minimaliste à ce stade, mais
# complet sur les trois portes qui doivent bloquer une PR : analyze, test, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.9

jobs:
  registry:
    name: Valide le registre des compteurs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Valide docs/registry/counters.json
        run: python3 tool/validate_registry.py

  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    needs: registry
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Installe les dépendances
        run: flutter pub get

      # Le seed embarqué est généré, jamais édité à la main (§3.1.4, §7.4).
      # En CI on vérifie seulement qu'il est à jour : une divergence est une
      # erreur de contribution, pas quelque chose à corriger silencieusement.
      - name: Vérifie que le seed du registre est synchronisé
        run: dart run tool/sync_registry_seed.dart --check

      # Le code généré par Drift est versionné pour que le repo se compile sans
      # étape de génération. En contrepartie, il peut diverger de sa source :
      # on le régénère et on exige qu'il n'ait pas bougé.
      - name: Vérifie que le code généré est à jour
        run: |
          dart run build_runner build
          git diff --exit-code

      # Dependabot résout les dépendances sans les contraintes du SDK Flutter :
      # il peut donc committer un lock que `flutter pub get` ne sait pas
      # produire. Comme pub réécrit un lock incohérent au lieu d'échouer, la
      # dérive passerait inaperçue sans cette vérification explicite.
      - name: Vérifie que pubspec.lock est synchronisé
        run: git diff --exit-code pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

      - name: Publie la couverture
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: warn

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Publie l'APK
        uses: actions/upload-artifact@v7
        with:
          name: fieldtally-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
