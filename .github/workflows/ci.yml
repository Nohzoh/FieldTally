# Build and tests (spec §7.1). Deliberately lean, but strict on the gates that
# should block a pull request: consistency, analyze, tests, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.9

jobs:
  registry:
    name: Validate the counter registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docs/registry/counters.json
        run: python3 tool/validate_registry.py

  build:
    name: Analyze, test & build APK
    runs-on: ubuntu-latest
    needs: registry
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The bundled seed is generated, never hand-edited (§3.1.4, §7.4). CI only
      # checks that it is current: a mismatch is a contribution mistake, not
      # something to silently fix.
      - name: Check the registry seed is in sync
        run: dart run tool/sync_registry_seed.dart --check

      # Drift's generated code is committed so the repo builds without a
      # generation step. The trade-off is that it can drift from its source, so
      # regenerate it and require that nothing moved.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code

      # Dependabot resolves dependencies without the Flutter SDK constraints, so
      # it can commit a lock file `flutter pub get` cannot reproduce. Since pub
      # rewrites an inconsistent lock instead of failing, the drift would go
      # unnoticed without this explicit check.
      - name: Check pubspec.lock is in sync
        run: git diff --exit-code pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: app/coverage/lcov.info
          if-no-files-found: warn

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: fieldtally-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
