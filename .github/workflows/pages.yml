# GitHub Pages deployment (spec §7.3).
#
# The site doubles as the CDN for docs/registry/counters.json, fetched at
# startup by every install of the app (§3.1.4) — hence the blocking validation
# before any deployment.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tool/validate_registry.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate the registry & build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Step 1 of §7.3: the only thing standing between a malformed pull
      # request and broken counter categorisation for every user at once.
      - name: Validate docs/registry/counters.json
        run: python3 tool/validate_registry.py

      - uses: actions/configure-pages@v6

      - name: Build Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
