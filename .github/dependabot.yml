# Mises à jour de dépendances (spec §7.4).
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: monthly
